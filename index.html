<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>A Terrible Time to Garden</title>
<style>
:root{color-scheme:dark;--green:#59ff9b;--muted:#8c9d94;--line:#2a3934}*{box-sizing:border-box}body{margin:0;background:#090d0c;color:#e1e9e3;font:15px/1.65 system-ui,sans-serif}button,input{font:inherit}button{color:inherit;background:#151c1a;border:1px solid var(--line);padding:11px 15px;cursor:pointer;border-radius:3px;min-height:44px}button:hover,button:focus-visible{border-color:var(--green);box-shadow:0 0 15px #59ff9b22}button:disabled{opacity:.4;cursor:not-allowed}.primary{background:#59ff9b;color:#091a10;font-weight:700}.muted,small{color:var(--muted)}h1,h2,h3,p{margin:0 0 16px}h1{font:clamp(42px,6vw,80px)/1.05 Georgia,serif;letter-spacing:-2px}h2{font-size:24px}h3{font-size:16px}header{padding:18px 3%;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}.eyebrow{color:var(--green);font:12px/2 monospace;letter-spacing:3px}.title{min-height:90vh;display:grid;grid-template-columns:1fr 1fr;align-items:center;gap:40px;padding:6%}.title nav{display:grid;gap:10px;max-width:330px}.title .art{min-height:490px}.layout{display:grid;grid-template-columns:190px minmax(0,1fr) 290px;gap:18px;padding:22px 3%}.panel{border:1px solid var(--line);background:#101714;padding:18px}.resources div{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line)}.stack{display:grid;gap:10px}.scene{position:relative;overflow:hidden;background:#0a100e;aspect-ratio:1.5;border:1px solid var(--line)}.scene svg,.art svg{width:100%;height:100%;display:block}.hot{position:absolute;background:#090d0cbb;font-size:12px;padding:5px 8px;min-height:38px}.labinfo{display:flex;justify-content:space-between;margin-bottom:8px}.slots{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}.slot{padding:10px 6px;text-align:left;min-width:0}.slot.selected{border-color:var(--green)}.slot svg{width:100%;height:90px}.slot small{display:block;font-size:11px}progress{width:100%;height:6px;accent-color:var(--green)}label{display:block;margin:15px 0}label span{display:flex;justify-content:space-between}input[type=range]{width:100%;accent-color:var(--green);min-height:28px}.bottom{display:grid;grid-template-columns:1fr 1.4fr;gap:18px;margin:0 3% 24px}.logs{max-height:180px;overflow:auto;font:12px/1.8 monospace}.logs p{margin:0 0 5px}.hint{border-left:2px solid var(--green);padding:12px;background:#59ff9b09;margin-top:14px}.badge{color:var(--green);font:12px monospace}.danger{color:#ff5b62}.overlay{position:fixed;inset:0;background:#020605dc;display:grid;place-items:center;padding:20px;z-index:10}.modal{width:min(580px,100%);max-height:90vh;overflow:auto;background:#111a16;border:1px solid #486653;padding:30px;box-shadow:0 0 90px #000}.modal button{margin:5px 5px 5px 0}.alarm .scene{box-shadow:inset 0 0 80px #ff5b6244}.glow{animation:breathe 4s infinite alternate}.dust{animation:drift 8s infinite alternate}@keyframes breathe{to{opacity:.55}}@keyframes drift{to{transform:translateY(-18px)}}.reduced *{animation:none!important;transition:none!important}@media(prefers-reduced-motion:reduce){*{animation:none!important}}@media(max-width:1000px){.layout{grid-template-columns:150px minmax(0,1fr)}.controls{grid-column:1/-1}.title{gap:15px}}@media(max-width:620px){.title{grid-template-columns:1fr;padding:24px}.title .art{min-height:240px;grid-row:1}.layout,.bottom{grid-template-columns:1fr}.resources{display:grid;grid-template-columns:1fr 1fr;gap:0 15px}.slots{grid-template-columns:repeat(2,1fr)}.scene{aspect-ratio:1.2}.hot{font-size:11px}.bottom{margin-top:0}header{font-size:12px}}
</style></head><body><main id="app"></main><div id="overlay"></div>
<script>
'use strict';
// 所有圖像為本檔 SVG/CSS 程式原創繪製；音效由 Web Audio 原創合成。
const SAVE_KEY='terrible-garden-v1', SETTINGS_KEY='terrible-garden-settings';
const PLANT_CONFIG={fern:{name:'原生蕨類',light:[30,65],humidity:[55,85],temperature:[18,28]},silverleaf:{name:'銀葉草',light:[40,75],humidity:[60,85],temperature:[20,29]},potato:{name:'馬鈴薯',light:[50,85],humidity:[40,70],temperature:[16,27]},mistthorn:{name:'霧棘草',light:[60,90],humidity:[25,55],temperature:[22,34]},veilvine:{name:'幽幕藤',light:[45,75],humidity:[60,90],temperature:[20,30]}};
const CHAPTER_CONFIG={1:{name:'最後的火種',daysLimit:8}};
const SCENE_CONFIG={LAB:'中央實驗室',MEDICAL:'廢棄醫療站',STORAGE:'糧食儲藏室',GREENHOUSE:'廢棄溫室',EXTERIOR:'實驗室外牆'};
const $=id=>document.getElementById(id), clamp=n=>Math.max(0,Math.min(100,n));
let settings={sound:true,reducedMotion:matchMedia('(prefers-reduced-motion: reduce)').matches};try{Object.assign(settings,JSON.parse(localStorage.getItem(SETTINGS_KEY))||{})}catch{}
function createInitialState(){return {version:1,status:'INTRO',chapter:1,day:1,daysLimit:8,daysRemaining:8,currentScene:'LAB',resources:{energy:60,water:30,nutrients:30,backupBattery:1,seeds:{fern:0,silverleaf:0,potato:0,mistthorn:0,veilvine:0},harvests:{},craftedItems:{},deliveredFood:0,reservedSeedPotatoes:0},environment:{light:20,humidity:40,temperature:16},plants:[{id:'original',species:'fern',displayName:'原生蕨類',health:45,growth:50,alive:true,mature:false,plantedDay:1,slotId:0}],chapterFlags:{originalFernRecovered:false,fernReproduced:false,inspected:false},eventFlags:{power:false,lowLightTurns:0},inventory:[],survivorHealth:100,defenseCount:0,wallZones:[],detectionRisk:0,logs:[],settings:{...settings},selectedSlot:0,completedChapters:[],unlockedScenes:['LAB']}}
let gameState=createInitialState();gameState.status='TITLE';let saveNotice='尚未儲存',audio;
function log(text){gameState.logs.unshift({day:gameState.day,text});gameState.logs=gameState.logs.slice(0,80)}
function playSound(type='click'){if(!gameState.settings.sound)return;try{audio??=new (window.AudioContext||window.webkitAudioContext)();audio.resume();const o=audio.createOscillator(),g=audio.createGain();o.connect(g);g.connect(audio.destination);o.frequency.setValueAtTime(type==='alarm'?160:type==='clear'?660:380,audio.currentTime);o.frequency.exponentialRampToValueAtTime(type==='clear'?990:180,audio.currentTime+.16);g.gain.setValueAtTime(.035,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+.2);o.start();o.stop(audio.currentTime+.21)}catch{}}
// 驗證結構及數值，損壞或不相容的存檔不進入遊戲。
function readSave(){try{const s=JSON.parse(localStorage.getItem(SAVE_KEY));if(!s||s.version!==1||s.chapter!==1||!['INTRO','PLAYING','EVENT','CHAPTER_CLEAR','CHAPTER_FAILED'].includes(s.status)||s.currentScene!=='LAB'||!Number.isInteger(s.day)||s.day<1||s.day>9||!Number.isInteger(s.daysRemaining)||s.daysRemaining<0||s.daysRemaining>8||s.day+s.daysRemaining!==9||s.daysLimit!==8||!Array.isArray(s.plants)||s.plants.length<1||s.plants.length>4||!s.plants.some(p=>p.id==='original')||!s.resources||!s.environment||!s.chapterFlags||!s.eventFlags||!s.settings||!Array.isArray(s.logs))return null;for(const k of ['energy','water','nutrients','backupBattery'])if(!Number.isFinite(s.resources[k])||s.resources[k]<0)return null;for(const [k,max]of [['light',100],['humidity',100],['temperature',40]])if(!Number.isFinite(s.environment[k])||s.environment[k]<0||s.environment[k]>max)return null;const slots=new Set();for(const p of s.plants){if(p.species!=='fern'||!Number.isInteger(p.slotId)||p.slotId<0||p.slotId>3||slots.has(p.slotId)||![p.health,p.growth].every(v=>Number.isFinite(v)&&v>=0&&v<=100)||p.alive!==(p.health>0)||p.mature!==(p.growth>=100))return null;slots.add(p.slotId)}if(!s.resources.seeds||!s.logs.every(l=>typeof l.text==='string'&&Number.isInteger(l.day)))return null;return s}catch{return null}}
function saveGame(){try{localStorage.setItem(SAVE_KEY,JSON.stringify(gameState));saveNotice='已自動儲存'}catch{saveNotice='儲存不可用：請勿關閉頁面'}}
function finishAction(){closeModal();saveGame();renderUI()}
function startNewGame(){if(readSave()){showModal('覆寫現有存檔？','開始新遊戲會移除目前第一關進度。',[['確認開始',()=>beginGame()],['取消',closeModal]]);return}beginGame()}
function beginGame(){gameState=createInitialState();log('Station 07 甦醒。VITA-01 仍維持一株瀕危原生蕨類。');closeModal();finishAction()}
function loadSavedGame(){const s=readSave();if(!s){showModal('無法讀取','沒有有效存檔，請開始新遊戲。');return}gameState=s;settings={...s.settings};closeModal();renderUI()}
function restartChapter(){const completed=gameState.completedChapters,unlocks=gameState.unlockedScenes;settings={...gameState.settings};gameState=createInitialState();gameState.completedChapters=completed;gameState.unlockedScenes=unlocks;log('已回到第一關初始檢查點；資源與植物狀態已重設。');closeModal();finishAction()}
function returnTitle(){closeModal();settings={...gameState.settings};gameState.status='TITLE';renderUI()}
function evaluateEnvironment(p){const c=PLANT_CONFIG[p.species],e={...gameState.environment};if(gameState.eventFlags.lowLightTurns>0)e.light=10;let ideal=true;for(const k of ['light','humidity','temperature']){const [lo,hi]=c[k],t=k==='temperature'?5:15;if(e[k]<lo-t||e[k]>hi+t)return 'bad';if(e[k]<lo||e[k]>hi)ideal=false}return ideal?'best':'normal'}
function canPlay(){return gameState.status==='PLAYING'}
function reject(msg){log(msg);finishAction();return false}
function setEnvironment(k,value){if(!canPlay())return;gameState.environment[k]=Number(value);log(`環境調整：${{light:'光照',humidity:'濕度',temperature:'溫度'}[k]} → ${value}`);finishAction()}
// 活體植物按槽位順序領用資源；不足時個別套用健康懲罰。
function updatePlantGrowth(){for(const p of [...gameState.plants].sort((a,b)=>a.slotId-b.slotId)){if(!p.alive)continue;let penalty=0;for(const [key,cost]of [['water',10],['nutrients',8]]){if(gameState.resources[key]>0){gameState.resources[key]--;log(`${p.displayName}：${key==='water'?'淨水':'養分'} -1`)}else{penalty+=cost;log(`${p.displayName}：缺${key==='water'?'水':'養分'}，健康 -${cost}`)}}const rating=evaluateEnvironment(p),before=p.health,old=p.growth;p.health=clamp(p.health+({best:5,normal:1,bad:-10}[rating])-penalty);p.growth=clamp(p.growth+({best:25,normal:15,bad:0}[rating]));p.alive=p.health>0;p.mature=p.growth>=100;log(`${p.displayName}：健康 ${before} → ${p.health}；成長 ${old} → ${p.growth}（${{best:'最佳',normal:'普通',bad:'惡劣'}[rating]}）`)}}
function updateRecovery(){const p=gameState.plants.find(p=>p.id==='original');if(p.alive&&p.mature&&p.health>=80&&!gameState.chapterFlags.originalFernRecovered){gameState.chapterFlags.originalFernRecovered=true;log('關鍵發現：原株恢復完成。成熟不代表健康已足夠，現在可進行繁殖。')}}
function checkOutcome(){updateRecovery();const s=gameState,p=s.plants.find(p=>p.id==='original');if(s.chapterFlags.originalFernRecovered&&s.chapterFlags.fernReproduced){s.status='CHAPTER_CLEAR';s.completedChapters=[1];log('生命延續程序恢復最低可行狀態。第二株蕨類已建立。');playSound('clear');return}if(!p.alive){s.status='CHAPTER_FAILED';s.failureReason='death';log('核心植物樣本已失效。');return}
// 最後一次推進先驗證成功；若只差免費繁殖，保留操作機會。
if(s.daysRemaining===0&&!(p.mature&&p.health>=80&&s.plants.length<4)){s.status='CHAPTER_FAILED';s.failureReason='timeout';log('恢復期限耗盡：未能建立第二株蕨類。')}}
let lastAdvance=0;
function advanceDay(){if(!canPlay())return;if(gameState.daysRemaining<=0)return reject('期限已到，只能立即繁殖。');if(Date.now()-lastAdvance<350)return;lastAdvance=Date.now();updatePlantGrowth();if(gameState.eventFlags.lowLightTurns>0)gameState.eventFlags.lowLightTurns--;gameState.day++;gameState.daysRemaining--;checkOutcome();if(canPlay()&&gameState.day===4&&!gameState.eventFlags.power){gameState.status='EVENT';log('危機：主照明中斷。請選擇應變措施。');playSound('alarm')}finishAction()}
function resolveEvent(choice){if(gameState.status!=='EVENT'||gameState.eventFlags.power)return;if(choice==='battery'){if(gameState.resources.backupBattery<1||gameState.resources.energy<10)return;gameState.resources.backupBattery--;gameState.resources.energy-=10;log('備用電池 -1；能源 -10。主照明維持原設定。')}else{gameState.eventFlags.lowLightTurns=2;log('緊急低光模式：之後兩次推進的實際光照固定為 10。')}gameState.eventFlags.power=true;gameState.status='PLAYING';checkOutcome();finishAction()}
function reproducePlant(){if(!canPlay())return;const p=gameState.plants.find(p=>p.slotId===gameState.selectedSlot);if(!p||!p.alive||!p.mature||p.health<80)return reject('繁殖失敗：請選擇成熟、存活且健康至少 80 的原株。');const slot=[0,1,2,3].find(i=>!gameState.plants.some(p=>p.slotId===i));if(slot===undefined)return reject('繁殖失敗：沒有空槽。');updateRecovery();p.health-=10;gameState.plants.push({id:'fern-2',species:'fern',displayName:'原生蕨類・新株',health:70,growth:0,alive:true,mature:false,plantedDay:gameState.day,slotId:slot});gameState.chapterFlags.fernReproduced=true;log('繁殖完成：原株健康 -10；新株健康 70、成長 0。');checkOutcome();finishAction()}
function plantSeed(){if(!canPlay())return;if(gameState.plants.some(p=>p.slotId===gameState.selectedSlot))return reject('此槽已有植物。');if(!gameState.resources.seeds.fern)return reject('沒有原生蕨類種子。第一關請照護原株，再以繁殖建立新株。')}
function handleHotspot(id){if(!canPlay())return;if(id==='vita'){gameState.selectedSlot=0;gameState.chapterFlags.inspected=true;log('VITA-01：四槽共用環境。原生蕨類理想光照 30–65、濕度 55–85、溫度 18–28°C。');finishAction()}if(id==='bench'){log('製作台檢查完成：第一關無可用配方；藥劑與防禦製作於後續里程碑開放。');finishAction()}if(id==='terminal')showModal('任務終端',objectiveText()+'<p>原株需健康至少 80 且成熟，再選擇原株繁殖。查看終端不耗日。</p>');if(id==='map')renderMap()}
function renderMap(){if(!canPlay())return;showModal('Station 07 / 區域狀態',Object.entries(SCENE_CONFIG).map(([id,name])=>`<p>${id==='LAB'?'● 目前位置':'鎖定'}　${name}<br><small>${id==='LAB'?'中央實驗室保持開放':'本里程碑尚未開放；於後續章節解鎖'}</small></p>`).join(''))}
function plantArt(p,hero=false){const health=p?.health??85,growth=p?.growth??80,color=health<=0?'#685748':health<50?'#7b9860':'#59ff9b';let leaves='';for(let i=0;i<8;i++){const y=132-i*13,w=(8-i)*3.8;leaves+=`<path d="M80 ${y} Q${80-w-8} ${y-21} ${80-w} ${y-8} Q${80-w} ${y+4} 80 ${y} M80 ${y} Q${80+w+8} ${y-21} ${80+w} ${y-8} Q${80+w} ${y+4} 80 ${y}"/>`}return `<svg viewBox="0 0 160 180" aria-hidden="true"><ellipse cx="80" cy="158" rx="47" ry="10" fill="#121e17"/><g transform="translate(80 155) scale(${.4+growth/170} ${health<=0?.25:.45+growth/170}) rotate(${health<50?14:0}) translate(-80 -155)" fill="${color}" stroke="${color}" stroke-width="1.5"><path d="M80 156 Q76 90 80 28" fill="none"/>${leaves}</g><ellipse cx="80" cy="160" rx="53" ry="8" fill="none" stroke="#426653"/></svg>`}
function labArt(){return `<svg viewBox="0 0 900 600" role="img" aria-label="原創地下實驗室：破裂天花板、冷光儀器與綠光培養艙"><defs><radialGradient id="a"><stop stop-color="#337958" stop-opacity=".55"/><stop offset="1" stop-color="#090d0c" stop-opacity="0"/></radialGradient><linearGradient id="b" x2="0" y2="1"><stop stop-color="#1f302a"/><stop offset="1" stop-color="#080e0b"/></linearGradient></defs><rect width="900" height="600" fill="#0a100e"/><path d="M0 0H900V425L650 365H230L0 450Z" fill="url(#b)"/><path d="M0 600L260 365H650L900 600" fill="#151e19"/><g stroke="#2a3934" fill="none" stroke-width="3"><path d="M50 0V450M180 0V390M720 0V400M840 0V440M0 130H900M0 150H900M100 600L320 365M800 600L600 365M0 510H900"/><path d="M280 0L310 50L290 100L360 150L340 205M590 0L570 50L640 80"/></g><path d="M0 45H250L220 70H0M650 38H900V65H680" fill="#36413a"/><rect x="60" y="260" width="120" height="150" rx="4" fill="#101b17" stroke="#344d40"/><rect x="80" y="280" width="80" height="45" fill="#143844"/><path d="M90 310L105 300L118 313L140 290" stroke="#62c7ff" fill="none"/><rect x="700" y="210" width="100" height="210" fill="#0a100e" stroke="#344d40"/><path d="M750 225V390" stroke="#4d6a58"/><ellipse class="glow" cx="445" cy="350" rx="260" ry="240" fill="url(#a)"/><path d="M330 390V180Q445 130 560 180V390" fill="#59ff9b08" stroke="#426653" stroke-width="4"/><ellipse cx="445" cy="180" rx="115" ry="27" fill="#1c3226" stroke="#53735f"/><ellipse class="glow" cx="445" cy="184" rx="87" ry="10" fill="#59ff9b" opacity=".4"/><ellipse cx="445" cy="391" rx="115" ry="28" fill="#233a2b" stroke="#59ff9b"/><path d="M330 390V445Q445 485 560 445V390" fill="#17261e" stroke="#41624b"/><path d="M362 447H520" stroke="#59ff9b" stroke-width="4"/><g transform="translate(325 155) scale(1.5)">${plantArt(gameState.status==='TITLE'?null:gameState.plants[0]).replace(/<svg[^>]*>|<\/svg>/g,'')}</g><path d="M570 460L650 435L690 460L650 490Z" fill="#27392e"/><g fill="#87b49a" opacity=".35" class="dust"><circle cx="290" cy="260" r="2"/><circle cx="600" cy="320" r="2"/><circle cx="400" cy="100" r="1.5"/><circle cx="200" cy="350" r="2"/></g><text x="65" y="240" fill="#6e8b7a" font-family="monospace" font-size="13">STATION 07 / 2189</text></svg>`}
function showModal(title,body,actions=[['關閉',closeModal]]){$('overlay').innerHTML='<div class="overlay"><section class="modal" role="dialog" aria-modal="true" aria-label="'+title+'"><div class="eyebrow">VITA SYSTEM</div><h2>'+title+'</h2><div>'+body+'</div><div id="modalActions"></div></section></div>';for(const [label,fn]of actions){const b=document.createElement('button');b.textContent=label;b.onclick=fn;$('modalActions').append(b)}$('modalActions').querySelector('button')?.focus()}
function closeModal(){$('overlay').innerHTML=''}
function showSettings(){if(gameState.status==='EVENT')return;showModal('設定',`<label><input id="sound" type="checkbox" ${gameState.settings.sound?'checked':''}> 原創合成音效</label><label><input id="motion" type="checkbox" ${gameState.settings.reducedMotion?'checked':''}> 減少動畫</label>`,[['套用',()=>{gameState.settings={sound:$('sound').checked,reducedMotion:$('motion').checked};settings={...gameState.settings};try{localStorage.setItem(SETTINGS_KEY,JSON.stringify(settings))}catch{}if(gameState.status!=='TITLE')saveGame();closeModal();renderUI()}],['返回主選單',returnTitle],['取消',closeModal]])}
function objectiveText(){return `<p>${gameState.chapterFlags.originalFernRecovered?'✓':'□'} 原株曾成熟且健康 ≥ 80<br>${gameState.chapterFlags.fernReproduced?'✓':'□'} 繁殖第二株原生蕨類</p>`}
function renderUI(){document.body.classList.toggle('reduced',gameState.settings.reducedMotion);const s=gameState;if(s.status==='TITLE'){const valid=readSave();$('app').innerHTML=`<section class="title"><div><div class="eyebrow">STATION 07 · BOTANICAL SURVIVAL</div><h1>A Terrible<br>Time to Garden</h1><h2>現在真的不是種花的時候</h2><p class="muted">The world is ending.<br>Your plants still need watering.</p><nav><button class="primary" id="new">開始新遊戲</button><button id="continue" ${valid?'':'disabled'}>繼續遊戲${valid?'':' · 無有效存檔'}</button><button id="help">操作說明</button><button id="settings">設定</button><button id="credits">製作資訊</button></nav><p><small>Milestone 1 · 第一章完整體驗</small></p></div><div class="art">${labArt()}</div></section>`;$('new').onclick=startNewGame;$('continue').onclick=loadSavedGame;$('help').onclick=()=>showModal('操作說明','<p>點擊培養槽查看原株。調整三個滑桿，再推進一天。四個槽共用同一組環境；只有推進時間會扣除日常水與養分。</p><p>健康至少 80、成熟且有空槽時，選擇原株進行繁殖。危機必須先選擇才能繼續。每次操作自動儲存，失敗可重試。</p>');$('settings').onclick=showSettings;$('credits').onclick=()=>showModal('製作資訊','<p>Student project · Built with AI assistance</p><p>All visuals are original：本作所有場景、植物與介面以 SVG / CSS 程式原創繪製。音效由 Web Audio API 原創合成，無外部素材、字體或網路依賴。</p>');return}
const active=canPlay(),p=s.plants.find(p=>p.slotId===s.selectedSlot),rating=p?evaluateEnvironment(p):null;const hint=!s.chapterFlags.inspected?'先點擊 VITA-01 或培養槽，檢查原生蕨類需求。':s.eventFlags.lowLightTurns?'低光覆寫生效：實際光照 10，剩餘 '+s.eventFlags.lowLightTurns+' 次推進。':s.chapterFlags.originalFernRecovered?'原株已恢復！選擇原株，按下繁殖。':s.plants[0].mature?'原株已成熟，但仍需要恢復至健康 80。最佳環境每次健康 +5。':'將三項環境調至理想區間，再推進一天；四槽共用設定。';

<small>點擊查看種植狀態</small>'}</button>`}).join('')}</div><div class="hint" role="status">VITA / ${hint}</div></section><aside class="panel controls"><div class="eyebrow">CULTIVATOR CONTROL</div><h3>${p?p.displayName:'空槽 '+(s.selectedSlot+1)}</h3><p class="muted">${p?'健康 '+p.health+' / 成長 '+p.growth+'%':'第一關無種子，需從原株繁殖。'}</p><small>原生蕨類理想環境<br>光照 30–65 · 濕度 55–85 · 溫度 18–28°C</small>${[['light','光照',100,''],['humidity','濕度',100,'%'],['temperature','溫度',40,'°C']].map(([key,label,max,unit])=>`<label><span>${label}<output id="out-${key}">${s.environment[key]}${unit}</output></span><input aria-label="${label}" id="${key}" type="range" min="0" max="${max}" value="${s.environment[key]}" ${active?'':'disabled'}></label>`).join('')}<p class="badge">${rating?{best:'最佳環境 · 健康 +5 / 成長 +25',normal:'普通環境 · 健康 +1 / 成長 +15',bad:'惡劣環境 · 健康 −10 / 不成長'}[rating]:'四槽共用環境設定'}</p><div class="stack"><button id="reproduce" ${active&&p?'':'disabled'}>繁殖原生蕨類</button><button id="plant" ${active&&!p?'':'disabled'}>種植蕨類種子</button><small>蕨類不採收；繁殖需成熟、健康 ≥ 80、有空槽。</small><button class="primary" id="advance" ${active&&s.daysRemaining>0?'':'disabled'}>推進一天 →</button><small>每株活體：淨水 −1 / 養分 −1</small></div></aside></div><div class="bottom"><section class="panel"><div class="eyebrow">OBJECTIVES</div><h3>生命延續程序</h3>${objectiveText()}</section><section class="panel"><div class="eyebrow">STATION LOG / 最新在上</div><div class="logs" id="logs"></div></section></div>`;
for(const l of s.logs){const line=document.createElement('p');line.textContent=`D${l.day} / ${l.text}`;$('logs').append(line)}
$('settings').onclick=showSettings;$('map').onclick=renderMap;$('codex').onclick=()=>showModal('植物圖鑑 / 原生蕨類','<p>光照 30–65、濕度 55–85、溫度 18–28°C。</p><p>全數理想：健康 +5、成長 +25。容忍區：健康 +1、成長 +15。超出容忍：健康 −10、不成長。光照／濕度容忍 15，溫度容忍 5°C。</p><p>第一關保護原株，成熟且健康 ≥ 80 時繁殖。新株健康 70、成長 0，原株健康 −10。繁殖不耗日。</p>');document.querySelectorAll('[data-hot]').forEach(b=>b.onclick=()=>handleHotspot(b.dataset.hot));document.querySelectorAll('[data-slot]').forEach(b=>b.onclick=()=>{if(!canPlay())return;s.selectedSlot=Number(b.dataset.slot);s.chapterFlags.inspected=true;log('檢查培養槽 '+(s.selectedSlot+1));finishAction()});for(const k of ['light','humidity','temperature']){$(k).oninput=e=>$('out-'+k).textContent=e.target.value+(k==='temperature'?'°C':k==='humidity'?'%':'');$(k).onchange=e=>setEnvironment(k,e.target.value)}$('advance').onclick=advanceDay;$('reproduce').onclick=reproducePlant;$('plant').onclick=plantSeed;
if(s.status==='INTRO')showModal('最後的火種','<p>2189 年。你在 Station 07 的低鳴中甦醒。地表已淪陷，唯一仍能穩定育種的 VITA-01 裡，有一株瀕危蕨類。</p><p>VITA：「請先檢查培養槽。我們還有八次培育週期。」</p>',[['啟動 VITA-01',()=>{s.status='PLAYING';closeModal();finishAction()}]]);

}
