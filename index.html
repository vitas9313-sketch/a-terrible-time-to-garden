<html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>豬事不妙！The Great Pig Escape</title><style>
*{box-sizing:border-box}body{margin:0;background:#102723;color:#fff7dc;font:17px/1.6 system-ui,sans-serif}button{font:inherit;cursor:pointer;border:2px solid #edc87b;border-radius:16px;background:#fff1cd;color:#25392a;min-height:48px;padding:10px 22px;font-weight:750;box-shadow:0 4px 0 #0003}button:hover,button:focus-visible{background:#ffdb7e;outline:3px solid #fff8;outline-offset:3px}button:disabled{opacity:.5;cursor:default}header{max-width:1200px;margin:auto;padding:14px 20px;display:flex;justify-content:space-between;gap:12px;align-items:center}header strong{font-size:23px}nav{display:flex;gap:8px}nav button{padding:6px 12px;font-size:15px}main{max-width:1200px;margin:auto;padding:0 16px 24px}.heading{display:flex;align-items:center;gap:16px;padding:6px 4px 14px}.heading small{color:#edc87b;white-space:nowrap}h1,h2,p{margin:0}h1{font-size:clamp(23px,4vw,38px)}.stage{position:relative;aspect-ratio:16/9;overflow:hidden;border-radius:24px;background:#204839;box-shadow:0 16px 60px #0006}.stage>svg{width:100%;height:100%;display:block}.art{animation:appear .45s ease-out}.intro .art{animation:camera 3s ease-out both}.caption{pointer-events:none;position:absolute;bottom:0;left:0;right:0;padding:30px 20px 16px;text-align:center;background:linear-gradient(transparent,#061b17e8);font-size:clamp(15px,2vw,23px);text-shadow:0 2px 4px #000}.target{position:absolute;transform:translate(-50%,-50%);background:#fff6d9ed;min-width:100px;border-color:#f8ce69;padding:8px 12px;animation:hint 2s infinite}.target.done{background:#c8f4cf;border-color:#6fc58a}.target svg{display:block;width:90px;height:58px;margin:auto}.actions{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;padding:20px 0 8px}.actions .primary{background:#ffd069;border-color:#ffd069}.feedback{text-align:center;padding:10px}.success{color:#a1ffc0}.failure{color:#ffd398}.titlecard{position:absolute;top:10%;left:6%;max-width:55%;text-shadow:0 3px 12px #102723}.titlecard h1{font-size:clamp(36px,7vw,82px);line-height:1.1}.titlecard p{margin-top:10px;font-size:clamp(12px,2vw,20px)}.tag{font-size:12px;color:#cfdbb9;text-align:center;margin-top:12px}.notice{text-align:center;color:#ffda9d;font-size:13px}.dialog{position:fixed;inset:0;display:grid;place-items:center;background:#001c17bb;z-index:5;padding:24px}.dialog section{max-width:440px;background:#24493c;padding:28px;border:2px solid #d9bd77;border-radius:24px}.dialog p{margin:14px 0}.released{animation:happy .6s ease-out}.reduced *{animation:none!important;transition:none!important}@keyframes camera{from{transform:scale(1.025)}to{transform:scale(1.075)}}@keyframes appear{from{opacity:.3;transform:scale(1.02)}to{opacity:1;transform:scale(1)}}@keyframes hint{50%{box-shadow:0 0 0 6px #ffdb7040}}@keyframes happy{50%{transform:translateY(-12px)}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}@media(max-width:600px){body{font-size:15px}header{padding:12px}header strong{font-size:19px}nav{gap:5px}nav button{font-size:13px;padding:6px 9px}main{padding:0 8px 20px}.heading{display:block;padding-left:8px}h1{font-size:23px}.stage{border-radius:16px}.target{top:60%!important;min-width:72px;padding:4px 6px;font-size:12px;min-height:44px;border-radius:12px}.target svg{width:50px;height:32px}.caption{padding:22px 8px 8px;font-size:13px}.actions{gap:8px;padding:16px 0}.actions button{padding:10px 16px;font-size:15px}.titlecard{top:9%;left:5%}.titlecard h1{font-size:39px}.titlecard p{font-size:12px}.tag{font-size:11px}}
</style></head><body><header><strong>豬事不妙！</strong><nav><button id="help" aria-label="操作說明">？</button><button id="music" aria-label="切換音樂">♫ 開</button><button id="home">主選單</button></nav></header><main id="app"></main><div id="dialog"></div><script>
'use strict';
// 本檔圖像為程式原創 SVG 佔位美術，尚非正式電影動畫完稿；音樂與音效均為原創合成。
const KEY='pig-escape-v1';
let scene='TITLE',introIndex=0,level=1,step=0,ropesReleased=[],ending=null,musicOn=true,unlockedLevel=1,completed=false,retryMessage='',feedback='',replaying=false,saveWarning='',introTimer=null,actionAt=0;
const $=id=>document.getElementById(id);
function readSave(){try{const d=JSON.parse(localStorage.getItem(KEY));if(!d||d.version!==1||!Number.isInteger(d.level)||d.level<1||d.level>3||!Number.isInteger(d.unlockedLevel)||d.unlockedLevel<d.level||d.unlockedLevel>3||typeof d.musicOn!=='boolean'||typeof d.completed!=='boolean'||![null,'A','B'].includes(d.ending)||d.completed!==(d.ending!==null))return null;return d}catch{return null}}
try{const setting=JSON.parse(localStorage.getItem('pig-music-v1'));if(typeof setting==='boolean')musicOn=setting}catch{}
const existing=readSave();if(existing){musicOn=existing.musicOn;unlockedLevel=existing.unlockedLevel}
// 只儲存關卡檢查點；重整後重新開始該關，不需要逐點存檔。
function saveGame(){try{localStorage.setItem(KEY,JSON.stringify({version:1,level,unlockedLevel,completed,ending,musicOn}));saveWarning=''}catch{saveWarning='此瀏覽器無法儲存；目前仍可遊玩。'}}
let audio=null,musicTimer=null,notes=[],beat=0;
function initAudio(){try{audio??=new(window.AudioContext||window.webkitAudioContext)();audio.resume()}catch{}}
function tone(freq,duration=.15,volume=.04,type='sine'){if(!audio||!musicOn)return;const o=audio.createOscillator(),g=audio.createGain();o.type=type;o.frequency.setValueAtTime(freq,audio.currentTime);g.gain.setValueAtTime(volume,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+duration);o.connect(g);g.connect(audio.destination);o.start();o.stop(audio.currentTime+duration);notes.push(o);o.onended=()=>notes=notes.filter(n=>n!==o)}
function stopMusic(){clearInterval(musicTimer);musicTimer=null;for(const n of notes){try{n.stop()}catch{}}notes=[]}
function startMusic(){stopMusic();if(!audio||!musicOn||document.hidden)return;beat=0;const melody=[523.25,659.25,783.99,659.25,587.33,523.25,440,493.88];const tempo=scene==='ENDING'?380:level===2&&scene!=='TITLE'?350:level===3&&scene!=='TITLE'?210:290;function tick(){tone(melody[beat%8]*(level===2?.5:1),.23,.017,level===2?'triangle':'sine');if(beat%2===0)tone(beat%8<4?130.81:110,.32,.021,'triangle');beat++}tick();musicTimer=setInterval(tick,tempo)}
function sound(kind){if(kind==='wrong'){tone(180,.2,.05);setTimeout(()=>tone(125,.2,.035),100)}else if(kind==='win'){[523,659,784].forEach((f,i)=>setTimeout(()=>tone(f,.23,.04),i*90))}else if(kind==='pig'){tone(180,.17,.04,'triangle');setTimeout(()=>tone(270,.13,.04,'triangle'),90)}else tone(440,.07,.025)}
document.addEventListener('visibilitychange',()=>document.hidden?stopMusic():startMusic());
// 共用角色讓項鍊、鼻形、比例跨場景一致；自由結局取下項鍊。
function pig(x=630,y=340,scale=1,mood='happy',necklace=true){return `<g transform="translate(${x} ${y}) scale(${scale})" class="${mood==='happy'?'released':''}"><ellipse cx="0" cy="70" rx="115" ry="18" fill="#091e2255"/><path d="M-75 40V70M-25 48V78M42 49V76M76 38V67" stroke="#c7677b" stroke-width="22" stroke-linecap="round"/><ellipse cx="-10" cy="0" rx="110" ry="76" fill="url(#pink)"/><path d="M-112 -12Q-151 -40 -142 -8Q-125 14 -121 -7" fill="none" stroke="#e69aaa" stroke-width="8"/><ellipse cx="67" cy="-9" rx="65" ry="66" fill="url(#pink)"/><path d="M31 -47Q8 -105 51 -66L63 -48M85 -55Q116 -112 122 -55L107 -32" fill="#eea0b0" stroke="#c9788e" stroke-width="4"/><ellipse cx="109" cy="14" rx="39" ry="27" fill="#f09aa9" stroke="#c8798c" stroke-width="3"/><ellipse cx="98" cy="15" rx="6" ry="9" fill="#9b4864"/><ellipse cx="122" cy="14" rx="6" ry="9" fill="#9b4864"/><ellipse cx="53" cy="-24" rx="12" ry="15" fill="white"/><ellipse cx="89" cy="-29" rx="10" ry="14" fill="white"/><circle cx="${mood==='sad'?49:57}" cy="-22" r="5" fill="#263941"/><circle cx="91" cy="-27" r="5" fill="#263941"/><path d="M53 35Q77 ${mood==='sad'?24:55} 94 35" stroke="#a14b63" stroke-width="4" fill="none"/>${necklace?'<path d="M17 -44Q-3 19 35 56" stroke="#eab849" stroke-width="13" fill="none"/><circle cx="31" cy="54" r="18" fill="#ffda66" stroke="#b58229" stroke-width="4"/><path d="M31 42L34 50L43 50L36 56L39 65L31 60L23 65L26 56L19 50L28 50" fill="#fff4b4"/>':''}</g>`}
function person(x,y,kind='guard',freed=false){return `<g transform="translate(${x} ${y})"><ellipse cx="0" cy="85" rx="48" ry="10" fill="#07191944"/><path d="M-15 45L-24 80M15 45L25 80" stroke="#ac8167" stroke-width="16" stroke-linecap="round"/><path d="M-31 -6L-36 48H35L28 -6Z" fill="${kind==='guard'?'#a6a24e':'#5b9dab'}"/><path d="M-28 0L-43 34M28 0L43 34" stroke="#c49a7d" stroke-width="13" stroke-linecap="round"/><circle cy="-34" r="32" fill="#d4aa8b"/><path d="M-33 -38Q-35 -84 15 -68L35 -38L8 -55L-20 -42Z" fill="#303c37"/><circle cx="-10" cy="-34" r="3" fill="#273936"/><circle cx="12" cy="-34" r="3" fill="#273936"/><path d="M-8 -16Q2 ${freed?-4:-12} 14 -16" stroke="#754d43" stroke-width="3" fill="none"/>${kind==='guard'?'<path d="M-36 -51L-16 -80L0 -61L21 -77L36 -50" fill="#d8cf8a"/><path d="M-20 -5L0 9L20 -5" stroke="#e7c989" fill="none" stroke-width="6"/>':'<path d="M-32 -49H34L26 -62H-22Z" fill="#e4ba6d"/>'}${!freed&&kind!=='guard'?'<path d="M-35 15H35M-35 25H35" stroke="#d3b47c" stroke-width="7"/>':''}</g>`}
function truck(flip=false){return `<g transform="translate(230 330) rotate(${flip?-17:0})"><rect x="-155" y="-100" width="220" height="115" rx="16" fill="#547c89" stroke="#b1c6bc" stroke-width="6"/><path d="M65 -65H135L167 -20V26H65Z" fill="#f2d17e"/><path d="M82 -54H123L148 -20H82Z" fill="#3b6468"/><circle cx="-100" cy="25" r="27" fill="#253334" stroke="#9bafaa" stroke-width="10"/><circle cx="110" cy="25" r="27" fill="#253334" stroke="#9bafaa" stroke-width="10"/><path d="M-135 -80H45M-135 -55H45M-135 -30H45" stroke="#b9d1c4" stroke-width="8"/><text x="-130" y="-110" fill="#fff1b5" font-size="22">CHAMPION EXPRESS</text></g>`}
function forest(){let trees='';for(let i=0;i<12;i++){let x=i*91-20;trees+=`<path d="M${x} 0L${x+15} 350L${x+49} 380L${x+34} 0" fill="${i%2?'#193f3c':'#245348'}"/><ellipse cx="${x}" cy="50" rx="140" ry="100" fill="${i%2?'#234c3d':'#30664b'}"/>`}return `<rect width="1000" height="563" fill="url(#sky)"/><path d="M0 240Q250 110 480 245T1000 200V563H0Z" fill="#63896a"/><path d="M0 300Q220 230 430 315T1000 270V563H0Z" fill="#35664e"/>${trees}<path d="M450 270Q560 330 385 563H880Q580 360 540 270" fill="url(#road)"/><g fill="#b5cd7d" opacity=".4"><circle cx="760" cy="180" r="4"/><circle cx="390" cy="230" r="3"/><circle cx="620" cy="130" r="4"/></g><path d="M770 0L410 480H520L950 0Z" fill="#ffebad" opacity=".08"/>`}
function cave(){return `<path d="M390 330Q370 100 640 92Q940 60 990 360Z" fill="#63776b"/><path d="M540 330Q520 150 720 149Q899 130 900 350Z" fill="#172d2b"/><path d="M580 340Q598 190 720 184Q838 190 856 350Z" fill="#091b1e"/><path d="M702 320Q671 281 704 253Q699 279 728 291Q758 259 753 242Q810 304 770 328Z" fill="#ffbc5b"/><ellipse cx="736" cy="337" rx="62" ry="10" fill="#ed884c55"/>`}
function art(kind){let body=forest();if(kind==='champion'){body=`<rect width="1000" height="563" fill="url(#gold)"/><path d="M0 0L300 563H430L280 0M1000 0L700 563H570L720 0" fill="#fff1a4" opacity=".15"/><ellipse cx="530" cy="440" rx="240" ry="45" fill="#cf8b47"/><rect x="340" y="420" width="350" height="70" rx="15" fill="#c48449"/><text x="460" y="470" fill="#fff0b1" font-size="42">No. 1</text>${pig(510,310,1.3)}<path d="M740 250H850V320Q795 390 740 320Z" fill="#f9d369"/><path d="M795 355V415M760 415H835" stroke="#f9d369" stroke-width="15"/>`}
if(kind==='road'||kind==='crash'||kind==='track'){body+=truck(kind!=='road');if(kind==='crash')body+=`<path d="M420 300Q510 90 710 190" fill="none" stroke="#fff3ca" stroke-width="6" stroke-dasharray="12 12"/>${pig(700,180,.7,'sad')}`}
if(kind==='track')body+=`<path d="M130 450Q460 355 760 460" fill="none" stroke="#cdbd8a" stroke-width="4" stroke-dasharray="4 25"/><circle cx="525" cy="420" r="12" fill="#ffdb64"/><path d="M520 408L525 397L531 408" fill="#fff6ae"/>`;
if(kind==='cave'||kind==='camp')body+=cave();
if(kind==='camp'){body+=`<ellipse cx="330" cy="415" rx="95" ry="23" fill="#795a42"/><path d="M300 410Q270 360 315 334Q315 370 337 378Q360 340 355 326Q410 389 363 416Z" fill="#f3aa53"/><path d="M295 377H365V411Q330 437 295 411Z" fill="#344242"/><path d="M288 375H372" stroke="#1b302e" stroke-width="8"/>`;body+=step===0?person(280,320):step===1&&feedback.includes('木棒')?`<g transform="rotate(70 220 360)">${person(220,350)}</g><text x="180" y="300" font-size="45" fill="#ffe383">✦ ✧ ✦</text>`:person(100,310,'guard',true);body+=pig(610,350,.92,ropesReleased.includes('pig')?'happy':'sad');body+=person(840,335,'hiker',ropesReleased.includes('hiker'));if(!ropesReleased.includes('pig'))body+='<path d="M540 315L665 368M545 335L660 385" stroke="#c9ad79" stroke-width="8"/>'}
if(kind==='exit')body+=`<path d="M750 270L810 150L864 270" stroke="#9cae71" stroke-width="12" fill="none"/><path d="M790 160H930V215H790Z" fill="#d4b777"/><text x="808" y="195" font-size="25" fill="#354d3b">出口 →</text>${pig(step===0?660:510,350,1.15,scene==='RETRY'?'sad':'happy')}${person(230,340,'hiker',true)}`;
if(kind==='phone'){body+=`<g transform="translate(560 265) rotate(9)"><rect x="-110" y="-180" width="220" height="350" rx="28" fill="#24383b" stroke="#e0c784" stroke-width="9"/><rect x="-88" y="-140" width="176" height="245" rx="12" fill="#cde1bb"/><text x="-68" y="-90" fill="#365747" font-size="22">富豪來電</text><circle cy="-22" r="38" fill="#cc9979"/><path d="M-48 -30Q-50 -90 45 -50L48 -20" fill="#49493e"/><path d="M-70 100Q-68 20 0 20Q68 20 70 100" fill="#71585c"/><circle cy="138" r="16" fill="#75b584"/></g>${pig(220,395,.65)}`}
if(kind==='mansion'){body=`<rect width="1000" height="563" fill="url(#sky)"/><rect y="400" width="1000" height="163" fill="#749c67"/><path d="M160 190L500 50L850 190Z" fill="#95776e"/><rect x="190" y="190" width="630" height="230" fill="#e8d6ae"/><path d="M440 420V260Q500 220 560 260V420" fill="#614f50"/>${[250,360,630,740].map(x=>`<rect x="${x}" y="240" width="45" height="90" rx="20" fill="#5c8990"/>`).join('')}${person(360,360,'hiker',true)}${pig(610,390,1,'sad')}<path d="M620 302L625 270L645 287L666 265L680 290L700 275L698 310Z" fill="#ffdc66"/>`}
if(kind==='free'){body+=`<path d="M690 240H930V300H690Z" fill="#e4cd8d"/><text x="705" y="280" fill="#375a44" font-size="25">森林保護區</text>${pig(560,340,1.25,'happy',false)}${person(230,350,'hiker',true)}<rect x="248" y="336" width="45" height="28" rx="5" fill="#263d40"/><circle cx="271" cy="349" r="9" fill="#92c5bd"/><circle cx="780" cy="457" r="19" fill="#eac05e"/>`}
return `<svg class="art" viewBox="0 0 1000 563" role="img" aria-label="${{champion:'戴金色獎牌的粉紅冠軍神豬',road:'森林山路上的冠軍運輸車',crash:'神豬安全飛離翻覆運輸車',track:'車禍現場的三條追蹤線索',cave:'森林深處有火光的山洞',camp:'奇幻洞穴營地、守衛、神豬與登山客',phone:'富豪急著來電尋豬',exit:'神豬在森林出口等待食物',mansion:'神豬回到富豪豪宅',free:'取下項鍊的神豬在保護區生活'}[kind]}"><defs><linearGradient id="sky" x2="0" y2="1"><stop stop-color="#bbd3bb"/><stop offset="1" stop-color="#e9c98c"/></linearGradient><radialGradient id="pink" cx=".35" cy=".25"><stop stop-color="#ffdae0"/><stop offset=".7" stop-color="#efa6b6"/><stop offset="1" stop-color="#ca7d96"/></radialGradient><linearGradient id="road" x2="0" y2="1"><stop stop-color="#afaa7c"/><stop offset="1" stop-color="#d6bc88"/></linearGradient><linearGradient id="gold" x2="1" y2="1"><stop stop-color="#58644a"/><stop offset="1" stop-color="#d49b58"/></linearGradient></defs>${body}</svg>`}
function icon(type){const shapes={deer:'<path d="M28 12Q10 24 19 51L32 34L39 51Q48 22 34 12Z" fill="#775c45"/>',pig:'<ellipse cx="28" cy="29" rx="10" ry="20" fill="#775c45"/><ellipse cx="51" cy="29" rx="10" ry="20" fill="#775c45"/><circle cx="74" cy="40" r="9" fill="#e3af32"/><path d="M70 30L75 21L80 30" fill="#e3af32"/>',shoe:'<path d="M30 10Q48 0 51 18L48 39L69 46Q74 60 48 59L27 47Z" fill="#59675d"/><path d="M34 22L46 27M31 31L45 36" stroke="#c5c8aa" stroke-width="3"/>',banana:'<path d="M20 10Q30 48 70 18Q54 68 20 39Q9 23 20 10" fill="#f9d35c" stroke="#bd9a3a" stroke-width="3"/>',stone:'<path d="M15 40L28 13L58 10L76 36L63 51H30Z" fill="#8f9d94" stroke="#586d67" stroke-width="4"/>',stick:'<path d="M19 48L68 12" stroke="#987446" stroke-width="16" stroke-linecap="round"/>',carrot:'<path d="M25 46L45 14L60 25Z" fill="#e99042"/><path d="M49 19L46 4M53 20L66 7" stroke="#60834a" stroke-width="6"/>',burger:'<path d="M15 27Q45 -6 76 27Z" fill="#dcaa5a"/><path d="M17 35H74" stroke="#5b4231" stroke-width="12"/><path d="M14 40L30 35L42 43L58 36L77 41" stroke="#78a552" stroke-width="7" fill="none"/><path d="M16 46H75V54H16Z" fill="#dfb06b"/>',cake:'<path d="M15 24L56 7L77 29V51H15Z" fill="#f2c6c2"/><path d="M15 25L56 9L77 29L15 32Z" fill="#fff0d3"/><path d="M15 40H77" stroke="#c96e86" stroke-width="5"/><path d="M47 18Q30 -3 47 1Q65 -3 47 18" fill="#d85a66"/>',rope:'<path d="M19 17Q52 52 72 18Q74 0 51 21Q15 57 18 32Q22 12 49 35L75 49" fill="none" stroke="#b48c53" stroke-width="8"/>'};return `<svg viewBox="0 0 90 64" aria-hidden="true">${shapes[type]||''}</svg>`}
function target(id,label,x,y,type,done=false){return `<button class="target ${done?'done':''}" data-choice="${id}" style="left:${x}%;top:${y}%" ${done?'disabled':''}>${icon(type)}${label}</button>`}
function dialog(text,confirmFn=null){$('dialog').innerHTML='<div class="dialog"><section role="dialog" aria-modal="true"><h2>豬事不妙！</h2><p id="dialogText"></p><button id="dialogOK">'+(confirmFn?'確定重新開始':'知道了')+'</button>'+(confirmFn?'<button id="cancel">取消</button>':'')+'</section></div>';$('dialogText').textContent=text;$('dialogOK').onclick=()=>{$('dialog').innerHTML='';confirmFn?.()};if(confirmFn)$('cancel').onclick=()=>$('dialog').innerHTML='';$('dialogOK').focus()}
const INTRO=[['champion','牠不是普通的豬，牠身價上億！'],['road','冠軍豬正要回豪宅……'],['crash','砰！一場車禍，牠飛進森林！'],['phone','快把我的寶貝豬找回來！'],['cave','但森林裡，有人先找到牠了……']];
function begin(){level=1;unlockedLevel=1;completed=false;ending=null;ropesReleased=[];step=0;replaying=false;introIndex=0;scene='INTRO';saveGame();render()}
function introNext(){if(scene!=='INTRO')return;if(introIndex<5){introIndex++;render()}}
function enterLevel(n){level=n;step=0;ropesReleased=[];feedback='';ending=null;completed=false;scene='LEVEL'+n;saveGame();render()}
function clearLevel(){scene='LEVEL_CLEAR';unlockedLevel=Math.min(3,Math.max(unlockedLevel,level+1));saveGame();sound('win');render()}
function wrong(text){retryMessage=text;scene='RETRY';sound('wrong');render()}
// 狀態守衛與短連點鎖，防止舊熱區重複領取或跳過關卡。
function choose(id){if(Date.now()-actionAt<250)return;actionAt=Date.now();if(scene==='LEVEL1'){if(id==='pig'){clearLevel();sound('pig')}else if(id==='deer')wrong('這隻豬難道長鹿角？');else if(id==='shoe')wrong('豬會穿登山鞋？')}else if(scene==='LEVEL2'){if(step===0){if(id==='stone')wrong('鏘！守衛回頭：「有人偷晚餐！」');else if(id==='banana'||id==='stick'){step=1;feedback=id==='banana'?'守衛追香蕉去了！快解開繩結。':'木棒一晃，守衛滿頭星星！快救人。';sound('win');render()}}else if(step===1&&['pig','hiker'].includes(id)&&!ropesReleased.includes(id)){ropesReleased.push(id);sound('pig');if(ropesReleased.length===2)clearLevel();else{feedback=id==='pig'?'神豬自由了，還有登山客！':'登山客得救，還有神豬！';render()}}}else if(scene==='LEVEL3'){if(step===0){if(id==='carrot')wrong('冠軍豬不吃這麼隨便！');else if(id==='burger')wrong('牠聞一聞：差一點就成功了！');else if(id==='cake'){step=1;feedback='蛋糕萬歲！神豬終於靠近你了。';sound('pig');render()}}else if(step===1&&['A','B'].includes(id)){ending=id;completed=true;scene='ENDING';saveGame();sound('win');render()}}}
function action(label,id,primary=true){return `<button data-action="${id}" class="${primary?'primary':''}">${label}</button>`}
function handleAction(id){if(Date.now()-actionAt<250)return;actionAt=Date.now();sound();if(id==='new'){if(readSave())dialog('重新開始會覆寫尋豬進度；舊版植物遊戲存檔不受影響。',begin);else begin()}if(id==='continue'){const d=readSave();if(!d)return;({level,unlockedLevel,musicOn,completed,ending}=d);if(!completed)level=unlockedLevel;step=0;ropesReleased=[];scene=completed?'ENDING':'LEVEL'+level;render()}if(id==='replay'){replaying=true;introIndex=0;scene='INTRO';render()}if(id==='next')introNext();if(id==='skip'){if(replaying){scene='TITLE';render()}else enterLevel(1)}if(id==='startlevel')enterLevel(1);if(id==='retry'){scene='LEVEL'+level;render()}if(id==='nextlevel'&&scene==='LEVEL_CLEAR')enterLevel(level+1);if(id==='home'){scene='TITLE';render()}}
function render(){clearTimeout(introTimer);$('music').textContent=musicOn?'♫ 開':'♫ 關';let title='',subtitle='',kind='cave',caption='',targets='',actions='',extra='';
if(scene==='TITLE'){title='一頭豬，兩種命運。';subtitle='三關迷你冒險';kind='exit';extra='<div class="titlecard"><h1>豬事不妙！</h1><p>THE GREAT PIG ESCAPE</p></div>';caption='找回億元冠軍豬，事情卻沒那麼簡單。';actions=action('開始遊戲','new')+(readSave()?action('繼續遊戲','continue',false):'')+action('重看故事','replay',false)}
if(scene==='INTRO'){subtitle='故事前導 / '+Math.min(introIndex+1,5)+' / 5';title=introIndex<5?'一億塊，飛走了。':'第一關：豬腳印之謎';if(introIndex<5){[kind,caption]=INTRO[introIndex];actions=action('下一幕 →','next')+action('略過','skip',false);introTimer=setTimeout(introNext,3200)}else{kind='track';caption='找出神豬留下的腳印！';actions=replaying?action('返回主選單','home'):action('開始第一關','startlevel')}}
if(scene==='LEVEL1'){title='點哪個才是神豬腳印？';subtitle='第一關 / 豬腳印之謎';kind='track';caption='大蹄印旁，好像有金色的東西……';targets=target('deer','鹿蹄印',21,74,'deer')+target('pig','大豬蹄印',52,74,'pig')+target('shoe','登山鞋印',82,74,'shoe')}
if(scene==='LEVEL2'){subtitle='第二關 / 今晚吃烤豬？';kind='camp';title=step===0?'先引開守衛！':'點兩個繩結，救出他們！';caption=feedback||(step===0?'長老：「不祥的粉紅惡魔！今晚把牠烤了！」':'趁守衛不注意，快解開繩結！');targets=step===0?target('banana','香蕉',18,76,'banana')+target('stone','石頭',45,76,'stone')+target('stick','木棒',77,76,'stick'):target('pig','神豬繩結',60,73,'rope',ropesReleased.includes('pig'))+target('hiker','旅人繩結',85,73,'rope',ropesReleased.includes('hiker'))}
if(scene==='LEVEL3'){subtitle='第三關 / 一億塊長了四條腿！';kind='exit';title=step===0?'用食物讓神豬靠近！':'成功！獎金，還是自由？';caption=step===0?'牽繩才剛拿出來，豬又跑了！':feedback;targets=step===0?target('carrot','胡蘿蔔',18,76,'carrot')+target('burger','漢堡',48,76,'burger')+target('cake','草莓蛋糕',80,76,'cake'):'';if(step===1){caption='登山客：「牠不想再比賽。」富豪：「獎金準備好了！」';actions='<button data-choice="A">帶回富豪家，領賞金</button><button data-choice="B">取下項鍊，讓豬自由</button>'}}
if(scene==='RETRY'){title='糟糕！再試一次';subtitle='第 '+level+' 關 / 選錯也沒關係';kind=level===1?'track':level===2?'camp':'exit';caption=retryMessage;extra='<div class="caption failure">'+retryMessage+'</div>';actions=action('再試一次','retry')}
if(scene==='LEVEL_CLEAR'){title='第 '+level+' 關完成！';subtitle='成功！';kind=level===1?'cave':'camp';caption=level===1?'找到了！那是山洞！':'登山客：「這不是新聞裡的一億神豬嗎？！」';actions=action(level===1?'前往山洞 →':'帶豬回家 →','nextlevel');extra='<div class="caption success">'+caption+'</div>'}
if(scene==='ENDING'){title=ending==='A'?'THE END — 富豪結局':'THE END — 自由結局';subtitle='第三關完成！';kind=ending==='A'?'mansion':'free';caption=ending==='A'?'任務完成，獎金到手！':'沒有賞金，但神豬終於自由了！';extra='<div class="caption success">'+caption+'</div>';actions=action('重新玩一次','new')+action('返回主選單','home',false)}
$('app').innerHTML=`<div class="heading"><small>${subtitle}</small><h1 class="${scene==='LEVEL_CLEAR'||scene==='ENDING'?'success':''}">${title}</h1></div><div class="stage ${scene==='INTRO'?'intro':''}">${art(kind)}${targets}${extra||'<div class="caption">'+caption+'</div>'}</div>${scene==='ENDING'?'<p class="feedback">'+(ending==='A'?'三天後，神豬又開始計畫逃跑。':'史上最貴的豬，終於不用比賽。')+'</p>':''}<div class="actions">${actions}</div><p class="notice">${saveWarning}</p><p class="tag">原創 SVG 場景佔位版 · 三關完整故事 · 點擊即可遊玩</p>`;
document.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>choose(b.dataset.choice));document.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>{initAudio();handleAction(b.dataset.action)});startMusic()}
$('help').onclick=()=>{initAudio();dialog('看上方任務，點發光物件。選錯按「再試一次」；答對按下一關。兩種結局都算成功！')};$('home').onclick=()=>{scene='TITLE';$('dialog').innerHTML='';render()};$('music').onclick=()=>{initAudio();musicOn=!musicOn;try{localStorage.setItem('pig-music-v1',JSON.stringify(musicOn))}catch{}const d=readSave();if(d){try{d.musicOn=musicOn;localStorage.setItem(KEY,JSON.stringify(d))}catch{}}$('music').textContent=musicOn?'♫ 開':'♫ 關';startMusic()};render();
</script></body></html>
